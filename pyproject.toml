[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-lid"
version = "0.1.0"
description = "Token-level language identification with any LLM provider"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Debby Oluwatuyi" }]
keywords = [
    "language identification",
    "code-switching",
    "nlp",
    "llm",
    "low-resource languages",
    "nigerian pidgin",
    "annotation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/anuoluwatuyi/llm-lid"
Repository = "https://github.com/anuoluwatuyi/llm-lid"
Issues = "https://github.com/anuoluwatuyi/llm-lid/issues"
Changelog = "https://github.com/anuoluwatuyi/llm-lid/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_lid"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_lid", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
